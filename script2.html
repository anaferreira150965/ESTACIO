<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste JavaScript</title>
</head>

<body>

<h1>Teste JavaScript</h1>

<div id="resultado"></div>

<script>
    var num1 = 5;
    var num2 = -1;
    var mensagem = "";

    if (num1 > num2 && num2 > 0) {
        mensagem = "A primeira variável é maior que a segunda e a segunda variável é um número positivo";
    }

    if (num1 > num2 && num2 <= 0) {
        mensagem = "A primeira variável é maior que a segunda e a segunda variável não é um número positivo";
    }

    if (num1 < num2 || num2 > 0) {
        mensagem = "A primeira variável é menor que a segunda ou a segunda variável é um número positivo";
    }

    document.getElementById("resultado").innerHTML = mensagem;
</script>

</body>
</html>
